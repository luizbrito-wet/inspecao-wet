function diasParaVencer(quandoAte, hojeIso) {
  if (!quandoAte) return null;
  return diasEntre(hojeIso, quandoAte);
}
function acaoElegivel(regra, acao, hojeIso) {
  if (acao.status !== "B) Pendente" || !acao.quandoAte) return false;
  const dias = diasParaVencer(acao.quandoAte, hojeIso);
  if (dias === null) return false;
  if (regra.tipo === "vencida") return dias < 0;
  return dias >= regra.janela.min && dias <= regra.janela.max;
}
function listarResponsaveis(valor) {
  return String(valor || "")
    .split(/\s*[\/;,|]\s*/g)
    .map((n) => n.trim())
    .filter(Boolean);
}
function juntarResponsaveis(nomes) {
  return Array.from(new Set((nomes || []).map((n) => String(n || "").trim()).filter(Boolean))).join(" / ");
}
function buscarEmailPorResponsavel(usuarios, nomeResponsavel) {
  const u = usuarios.find((x) => x.nome.trim().toLowerCase() === (nomeResponsavel || "").trim().toLowerCase());
  return u ? u.email : null;
}
function emailsCoordenadoresSupervisores(usuarios) {
  // Regra da planilha Listas: para ações vencidas, copiar exatamente a lista
  // "Coordenador e Supervisores" cadastrada na própria planilha.
  const grupo = usuarios.find((u) => (u.nome || "").trim().toLowerCase() === "coordenador e supervisores");
  if (!grupo || !grupo.email) return [];
  const set = new Set();
  grupo.email.split(";").forEach((e) => { const t = e.trim(); if (t) set.add(t); });
  return Array.from(set);
}
function montarCorpoEmail(regra, responsavel, itens, hojeIso) {
  const linhas = itens.map((a) => {
    const dias = diasParaVencer(a.quandoAte, hojeIso);
    const diasTxt = regra.tipo === "vencida" ? `${Math.abs(dias)} dia(s) em atraso` : `${dias} dia(s) restantes`;
    return `• [Item ${a.item}] ${a.acao} — Prazo: ${fmtBR(a.quandoAte)} (${diasTxt})`;
  }).join("\n");
  const linkApp = (typeof window !== "undefined" && window.location && window.location.href) ? window.location.href : "";
  return `Olá ${responsavel},\n\n${regra.introducao}\n\n${linhas}\n\nPor favor, verifique o andamento e atualize o status no sistema (Plano de Ações 5W2H · FS LOG Site SMT).\n\nAcesse o aplicativo: ${linkApp}\n\nAtenciosamente,\nPlano de Ações · FS LOG Site SMT`;
}
function montarMailto(destinatarios, cc, assunto, corpo) {
  const partes = [`subject=${encodeURIComponent(assunto)}`, `body=${encodeURIComponent(corpo)}`];
  if (cc && cc.length) partes.push(`cc=${encodeURIComponent(cc.join(","))}`);
  return `mailto:${destinatarios.join(",")}?${partes.join("&")}`;
}

const MESES_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS_SEMANA_PT = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

function isoLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function gerarGradeMes(ano, mes) {
  const primeiroDia = new Date(ano, mes, 1);
  const inicioGrade = new Date(ano, mes, 1 - primeiroDia.getDay());
  const dias = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(inicioGrade);
    d.setDate(inicioGrade.getDate() + i);
    dias.push({ date: d, iso: isoLocal(d), noMes: d.getMonth() === mes });
  }
  return dias;
}
function fmtHora(h) { return h || "—"; }
function fmtDataLonga(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return `${d} de ${MESES_PT[m - 1]} de ${y} · ${DIAS_SEMANA_PT[dt.getDay()]}`;
}

function hojeISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fmtBR(iso) {
  if (!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function diasEntre(a, b) {
  if (!a || !b) return null;
  const d1 = new Date(a), d2 = new Date(b);
  return Math.round((d2 - d1) / 86400000);
}

function statusClasse(s) {
  if (s === "A) Concluído") return "pill-concluido";

function statusLabel(s) { return (s || "").replace(/^[A-D]\)\s*/, ""); }
function importanciaClasse(i) {
  if (i === "A) Alta Alta") return "pill-altaalta";
  if (i === "B) Alta") return "pill-alta";

/* ---------- gráfico de barras (Chart.js) ---------- */
function BarChart({ labels, data, colors, isLight, suffix = "" }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !window.Chart) return;
    const gridColor = isLight ? "rgba(20,25,35,0.08)" : "rgba(255,255,255,0.08)";
    const tickColor = isLight ? "#5b6472" : "#8f98ab";
    const labelColor = isLight ? "#161b26" : "#e8ecf3";

    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: {
        labels,
        datasets: [{
          data,
          backgroundColor: colors,
          borderRadius: 4,
          maxBarThickness: 48,
          categoryPercentage: 0.7,
          barPercentage: 0.8,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 400 },
        layout: { padding: { top: 22 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: { label: (ctx) => `${ctx.formattedValue}${suffix}` },
          },
          datalabels: {
            anchor: "end",
            align: "top",
            clamp: true,
            color: labelColor,
            font: { weight: "700", size: 11.5 },
            formatter: (v) => `${v}${suffix}`,
          },
        },
        scales: {
          x: {
            ticks: { color: tickColor, font: { size: 11.5, weight: "600" } },
            grid: { display: false },
          },
          y: {
            beginAtZero: true,
            ticks: { color: tickColor, precision: 0 },
            grid: { color: gridColor },
          },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(labels), JSON.stringify(data), JSON.stringify(colors), isLight, suffix]);

  return <canvas ref={canvasRef}></canvas>;
}

  async function enviarAoPowerAutomate(regra, grupo) {
    const url = powerAutomateUrl.trim();
    if (!url) throw new Error("URL do Power Automate não configurada.");
    if (!grupo.email) throw new Error("Responsável sem e-mail cadastrado.");
    const payload = payloadPowerAutomate(regra, grupo);
    const resposta = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!resposta.ok) {
      let detalhe = "";
      try { detalhe = (await resposta.text()).slice(0, 180); } catch (e) {}
      throw new Error(`Power Automate retornou HTTP ${resposta.status}${detalhe ? `: ${detalhe}` : ""}`);
    }
    return payload;
  }

  const dragTabelaRef = useRef({ ativo: false, inicioX: 0, scrollLeft: 0, movido: false, suprimirClique: false });
  function iniciarArrastoTabela(e) {
    if (e.button !== 0 || e.target.closest("input,select,button,a,textarea")) return;
    const el = e.currentTarget;
    dragTabelaRef.current = { ativo: true, inicioX: e.clientX, scrollLeft: el.scrollLeft, movido: false, suprimirClique: false };
    el.classList.add("dragging");
  }
  function moverArrastoTabela(e) {
    const drag = dragTabelaRef.current;
    if (!drag.ativo) return;
    const deltaX = e.clientX - drag.inicioX;
    if (Math.abs(deltaX) > 8) {
      drag.movido = true;
      drag.suprimirClique = true;
      e.currentTarget.scrollLeft = drag.scrollLeft - deltaX;
      e.preventDefault();
    }
  }
  function finalizarArrastoTabela(e) {
    const drag = dragTabelaRef.current;
    drag.ativo = false;
    e.currentTarget.classList.remove("dragging");
    // Se houve arrasto real, bloqueia somente o clique gerado pelo próprio arrasto.
    // O estado é limpo logo em seguida para nunca engolir o próximo clique do usuário.
    if (drag.movido) {
      setTimeout(() => {
        dragTabelaRef.current.movido = false;
        dragTabelaRef.current.suprimirClique = false;
      }, 0);
    }
  }
  function bloquearCliqueAposArrasto(e) {
    if (!dragTabelaRef.current.suprimirClique) return;

  function enviarEvidencia(acao, file) {
    const ehImagem = file.type.startsWith("image/");
    const ehVideo = file.type.startsWith("video/");
    if (!ehImagem && !ehVideo) {
      setToast("Só é possível anexar imagens ou vídeos.");
      setTimeout(() => setToast(null), 3000);
      return;
    }
    const lista = acao.evidencias || [];
    const qtdImagens = lista.filter((e) => e.tipo === "imagem").length;
    const qtdVideos = lista.filter((e) => e.tipo === "video").length;
    if (ehImagem && qtdImagens >= MAX_IMAGENS) {
      setToast(`Limite de ${MAX_IMAGENS} imagens por ação atingido.`);
      setTimeout(() => setToast(null), 3000);
      return;
    }
    if (ehVideo && qtdVideos >= MAX_VIDEOS) {
      setToast(`Limite de ${MAX_VIDEOS} vídeos por ação atingido.`);
      setTimeout(() => setToast(null), 3000);
      return;
    }
    const evidenciaId = `EV-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    formData.append("folder", `evidencias/${acao.id}`);

    setEvidenciaUpload({ progresso: 0 });
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) setEvidenciaUpload({ progresso: Math.round((e.loaded / e.total) * 100) });
    };
    xhr.onload = () => {
      setEvidenciaUpload(null);
      if (xhr.status < 200 || xhr.status >= 300) {
        setToast("Falha no upload. Confira se o Cloudinary está configurado corretamente.");
        setTimeout(() => setToast(null), 4000);
        return;
      }
      const resp = JSON.parse(xhr.responseText);
      const nova = {
        id: evidenciaId, tipo: ehImagem ? "imagem" : "video", url: resp.secure_url, publicId: resp.public_id,
        nome: file.name, criadoPor: usuarioAuth.email, criadoEm: new Date().toISOString(),
      };
      setAcoes((list) => list.map((a) => a.id === acao.id ? { ...a, evidencias: [...(a.evidencias || []), nova] } : a));
    };
    xhr.onerror = () => {
      setEvidenciaUpload(null);
      setToast("Falha de conexão ao enviar o arquivo.");
      setTimeout(() => setToast(null), 4000);
    };
    xhr.send(formData);
  }

  function normalizarNomeResponsavel(valor) {
    return (valor || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toLowerCase();
  }

  function usuarioEhResponsavelDaAcao(acao) {
    if (!usuarioAtual || !acao) return false;
    const meuNome = normalizarNomeResponsavel(usuarioAtual.nome);
    if (!meuNome) return false;
    const responsaveis = listarResponsaveis(acao.responsavel)
      .map(normalizarNomeResponsavel)
      .filter(Boolean);
    return responsaveis.includes(meuNome);
  }

  function removerEvidencia(acao, evidencia) {
    if (!usuarioEhResponsavelDaAcao(acao)) {
      setToast("Você só pode excluir evidências de ações atribuídas ao seu usuário.");
      setTimeout(() => setToast(null), 3500);
      return;
    }
    const ok = window.confirm("Remover esta evidência da ação? (o arquivo continua guardado no Cloudinary, apenas deixa de aparecer aqui)");
    if (!ok) return;
    setAcoes((list) => list.map((a) => a.id === acao.id ? { ...a, evidencias: (a.evidencias || []).filter((e) => e.id !== evidencia.id) } : a));
    if (evidenciaAmpliada && evidenciaAmpliada.id === evidencia.id) setEvidenciaAmpliada(null);
    setToast("Evidência removida.");
    setTimeout(() => setToast(null), 2500);
  }

  function impedirDigitacaoData(e) {
    // Mantem o campo de data para selecao pelo calendario do navegador.
    if (e.key !== "Tab" && e.key !== "Shift") e.preventDefault();
  }

  function abrirSeletorSubAcao() {
    setBuscaSubAcao("");
    setSeletorSubAcaoAberto(true);
  }
  function fecharSeletorSubAcao() { setSeletorSubAcaoAberto(false); }

  function proximoSubItem(itemPai) {
    const prefixo = `${itemPai}.`;
    const numeros = acoes
      .map((a) => a.item)
      .filter((it) => it && it.startsWith(prefixo))
      .map((it) => parseInt(it.slice(prefixo.length).split(".")[0], 10))
      .filter((n) => !isNaN(n));
    const max = numeros.length ? Math.max(...numeros) : 0;
    return `${itemPai}.${max + 1}`;
  }

  function escolherPaiSubAcao(acaoPai) {
    setForm({
      ...CAMPOS_VAZIOS,
      item: proximoSubItem(acaoPai.item),
      origem: acaoPai.origem || ORIGENS[0],
      responsavel: acaoPai.responsavel || (usuarios[0]?.nome || ""),
      importancia: acaoPai.importancia || "B) Alta",
    });
    setEditando(null);
    setSubAcaoDe(acaoPai);
    setErro("");
    setSeletorSubAcaoAberto(false);
    setModalAberto(true);
  }

  const acoesParaSelecionarPai = useMemo(() => {
    if (!buscaSubAcao) return acoes;
    const alvo = buscaSubAcao.toLowerCase();
    return acoes.filter((a) => `${a.item} ${a.acao} ${a.responsavel}`.toLowerCase().includes(alvo));
  }, [acoes, buscaSubAcao]);

  function salvar(e) {
    e.preventDefault();
    if (!form.acao.trim()) return setErro("Descreva a ação.");
    if (!form.responsavel) return setErro("Selecione um responsável.");
    if (!form.dataStart) return setErro("Informe a data de início.");

    let dadosForm = { ...form, origem: form.origem.trim() || "Outro" };

    if (editando && !isAdm) {
      const original = acoes.find((a) => a.id === editando);
      if (!original || !usuarioEhResponsavelDaAcao(original)) {
        setErro("Você só pode editar ações em que é responsável ou um dos responsáveis.");
        return;
      }
      if (original) {
        CAMPOS_PROTEGIDOS_ADM.forEach((campo) => {
          // Exceção: se Detalhamento ainda estiver vazio, o responsável pode preenchê-lo uma única vez.
          if (campo === "descricao" && !String(original.descricao || "").trim()) return;
          dadosForm[campo] = original[campo];
        });
      }
    }

    if (editando) {
      setAcoes((list) => list.map((a) => a.id === editando ? { ...dadosForm, id: editando } : a));
      setToast("Ação atualizada.");
    } else {
      const novoItem = dadosForm.item || proximoItemNovaAcao();
      // Novas acoes entram sempre no fim da tabela, preservando a ordem cronologica de cadastro.
      setAcoes((list) => [...list, { ...dadosForm, id: `ACT-${Date.now()}`, item: novoItem }]);
      setToast("Ação registrada.");
    }
    setModalAberto(false);
    setTimeout(() => setToast(null), 3000);
  }

  function excluir(acao) {
    if (!isAdm) { setToast("Apenas usuários ADM podem excluir ações."); setTimeout(() => setToast(null), 3000); return; }
    const ok = window.confirm(`Excluir a ação "${acao.acao.slice(0, 60)}..."?\n\nEsta ação não pode ser desfeita.`);
    if (!ok) return;
    setAcoes((list) => list.filter((a) => a.id !== acao.id));
    setModalAberto(false);
    setToast("Ação excluída.");
    setTimeout(() => setToast(null), 3000);
  }

  function mudarStatusRapido(acao, novoStatus) {
    setAcoes((list) => list.map((a) => a.id === acao.id
      ? { ...a, status: novoStatus, dataConclusao: novoStatus === "A) Concluído" ? (a.dataConclusao || hojeISO()) : a.dataConclusao }
      : a
    ));
  }

  const acaoEmEdicao = editando ? acoes.find((a) => a.id === editando) : null;
  const userPodeEditarAcaoAtual = !editando || isAdm || usuarioEhResponsavelDaAcao(acaoEmEdicao);
  const camposBloqueados = !!editando && !isAdm && userPodeEditarAcaoAtual;
  const campoBloqueadoParaUser = (campo) => {
    if (!editando || isAdm) return false;
    if (!userPodeEditarAcaoAtual) return true;
    if (!CAMPOS_PROTEGIDOS_ADM.includes(campo)) return false;
    if (campo === "descricao" && acaoEmEdicao && !String(acaoEmEdicao.descricao || "").trim()) return false;
    return true;
  };

  const acoesFiltradas = useMemo(() => {
    return acoes.filter((a) => {
      if (filtroStatus && a.status !== filtroStatus) return false;
      if (filtroImportancia && a.importancia !== filtroImportancia) return false;
      if (filtroResponsavel && !listarResponsaveis(a.responsavel).includes(filtroResponsavel)) return false;
      if (busca) {
        const alvo = `${a.acao} ${a.descricao} ${a.item} ${a.responsavel}`.toLowerCase();
        if (!alvo.includes(busca.toLowerCase())) return false;
      }
      for (const [chave, valor] of Object.entries(filtrosColuna)) {
        if (!valor) continue;
        if (chave === "item" && !String(a.item || "").toLowerCase().includes(valor.toLowerCase())) return false;
        if (chave === "data" && !fmtBR(a.data).includes(valor)) return false;
        if (chave === "origem" && a.origem !== valor) return false;
        if (chave === "acao" && !String(a.acao || "").toLowerCase().includes(valor.toLowerCase())) return false;
        if (chave === "descricao" && !String(a.descricao || "").toLowerCase().includes(valor.toLowerCase())) return false;
        if (chave === "fup" && !String(a.fup || "").toLowerCase().includes(valor.toLowerCase())) return false;
        if (chave === "dataStart" && !fmtBR(a.dataStart).includes(valor)) return false;
        if (chave === "importancia" && a.importancia !== valor) return false;
        if (chave === "status" && a.status !== valor) return false;
        if (chave === "quandoAte" && !fmtBR(a.quandoAte).includes(valor)) return false;
        if (chave === "responsavel" && !listarResponsaveis(a.responsavel).includes(valor)) return false;
        if (chave === "dataConclusao" && !fmtBR(a.dataConclusao).includes(valor)) return false;
        if (chave === "postergar" && (a.postergar || "NÃO") !== valor) return false;
        if (chave === "justificativa" && !String(a.justificativa || "").toLowerCase().includes(valor.toLowerCase())) return false;
        if (chave === "eficacia" && !String(a.eficacia || "").toLowerCase().includes(valor.toLowerCase())) return false;
      }
      return true;
    });
  }, [acoes, busca, filtroStatus, filtroImportancia, filtroResponsavel, filtrosColuna]);

  const valoresUnicosEvento = useMemo(() => Array.from(new Set(acoes.map((a) => a.origem).filter(Boolean))).sort(), [acoes]);

  const dash = useMemo(() => {
    const total = acoes.length;
    const concluidas = acoes.filter((a) => a.status === "A) Concluído").length;
    const pendentes = acoes.filter((a) => a.status === "B) Pendente").length;
    const andamento = acoes.filter((a) => a.status === "C) Em Andamento").length;
    const vencidas = acoes.filter(estaVencida).length;

    const tempos = acoes
      .filter((a) => a.status === "A) Concluído" && a.dataStart && a.dataConclusao)
      .map((a) => diasEntre(a.dataStart, a.dataConclusao))
      .filter((d) => d !== null && d >= 0);
    const tempoMedio = tempos.length ? Math.round(tempos.reduce((s, d) => s + d, 0) / tempos.length) : null;

    const porImportancia = IMPORTANCIAS.map((imp) => ({
      imp, label: importanciaLabel(imp), qtd: acoes.filter((a) => a.importancia === imp).length,
    }));
    const porResponsavel = {};
    acoes.forEach((a) => {
      listarResponsaveis(a.responsavel).forEach((nome) => {
        porResponsavel[nome] = (porResponsavel[nome] || 0) + 1;
      });
    });
    const rankingResp = Object.entries(porResponsavel).sort((a, b) => b[1] - a[1]).slice(0, 8);

    // gráfico: Status x Usuário (série por status, categorias por responsável)
    const nomesResp = rankingResp.map(([nome]) => nome);
    const statusSeriesCores = { "A) Concluído": "#1fa860", "B) Pendente": "#a41111", "C) Em Andamento": "#f2d94e", "D) Cancelado": "#8f98ab" };
    const graficoStatusUsuario = {
      labels: nomesResp,
      series: STATUS_OPCOES.map((s) => ({
        nome: statusLabel(s),
        cor: statusSeriesCores[s] || "#4fb8e0",
        data: nomesResp.map((nome) => acoes.filter((a) => listarResponsaveis(a.responsavel).includes(nome) && a.status === s).length),
      })),
    };

    // gráfico: Importância das Ações (com Total Geral)
    const graficoImportancia = {
      labels: [...porImportancia.map((r) => r.label), "Total Geral"],
      data: [...porImportancia.map((r) => r.qtd), total],
      colors: ["#c0292d", "#f0954a", "#f2d94e", "#1fa860"],
    };

    // gráfico: Status de Fechamento das Ações (com Total Geral)
    const porStatus = STATUS_OPCOES.map((s) => ({
      status: s, label: statusLabel(s), qtd: acoes.filter((a) => a.status === s).length,
    }));
    const graficoStatus = {
      labels: [...porStatus.map((r) => r.label), "Total Geral"],
      data: [...porStatus.map((r) => r.qtd), total],
      colors: ["#4fb8e0", "#a41111", "#f2d94e", "#1fa860"],
    };

    // gráfico: Tempo médio "DIAS" de fechamento das ações, por status
    const hoje = hojeISO();
    const graficoTempo = STATUS_OPCOES.map((s) => {
      const itens = acoes.filter((a) => a.status === s && a.dataStart);
      const dias = itens.map((a) => diasEntre(a.dataStart, s === "A) Concluído" ? (a.dataConclusao || hoje) : hoje))
        .filter((d) => d !== null && d >= 0);
      const media = dias.length ? Math.round(dias.reduce((s2, d) => s2 + d, 0) / dias.length) : 0;
      return { status: s, label: statusLabel(s), media };
    });

    return {
      total, concluidas, pendentes, andamento, vencidas, tempoMedio, porImportancia, rankingResp,
      graficoImportancia, graficoStatus, graficoTempo, graficoStatusUsuario,
    };
  }, [acoes]);

  function dadosRelatorioAcoes() {
    return acoes.map((a) => ({
      "ID": a.id || "",
      "Item": a.item || "",
      "Data de Registro": a.data ? fmtBR(a.data) : "",
      "Evento": a.origem || "",
      "Ação": a.acao || "",
      "Detalhamento | Como Executar": a.descricao || "",
      "O que foi feito (FUP)": a.fup || "",
      "Evidências": (a.evidencias || []).map((e) => e.url || e.nome || "").filter(Boolean).join(" | "),
      "Data (Start)": a.dataStart ? fmtBR(a.dataStart) : "",
      "Importância": importanciaLabel(a.importancia || ""),
      "Status": statusLabel(a.status || ""),
      "Quando? (Até)": a.quandoAte ? fmtBR(a.quandoAte) : "",
      "Responsável": a.responsavel || "",
      "Data de Conclusão": a.dataConclusao ? fmtBR(a.dataConclusao) : "",
      "Tempo Ação Aberta (dias)": diasAbertos(a) ?? "",
      "Postergar": a.postergar || "",
      "Justificativa": a.justificativa || "",
      "Eficácia": a.eficacia || "",
    }));
  }

  function baixarArquivo(blob, nome) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function exportarExcel() {
    const dados = dadosRelatorioAcoes();
    const cols = dados.length ? Object.keys(dados[0]) : [];
    const esc = (v) => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;");
    const tabela = `<table border="1"><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${dados.map((r) => `<tr>${cols.map((c) => `<td>${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    const html = `<!doctype html><html><head><meta charset="UTF-8"></head><body>${tabela}</body></html>`;
    baixarArquivo(new Blob(["\ufeff", html], { type: "application/vnd.ms-excel;charset=utf-8" }), `FS_LOG_Base_Completa_${hojeISO()}.xls`);
    setToast("Base completa exportada para Excel.");
    setTimeout(() => setToast(null), 2500);
  }

  function exportarPDF() {
    const dados = dadosRelatorioAcoes();
    try {
      const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
      if (!jsPDFCtor) throw new Error("Biblioteca de PDF não carregada");
      const doc = new jsPDFCtor({ orientation: "landscape", unit: "mm", format: "a3" });
      doc.setFontSize(14);
      doc.text("FS LOG Site SMT | Base Completa de Ações", 14, 12);
      doc.setFontSize(8);
      doc.text(`Gerado em ${new Date().toLocaleString("pt-BR")} | Total: ${dados.length} ações`, 14, 18);
      const colunas = ["Item","Data de Registro","Evento","Ação","Detalhamento | Como Executar","O que foi feito (FUP)","Data (Start)","Importância","Status","Quando? (Até)","Responsável","Data de Conclusão","Postergar","Justificativa","Eficácia"];
      doc.autoTable({
        startY: 22,
        head: [colunas],
        body: dados.map((r) => colunas.map((c) => r[c])),
        styles: { fontSize: 5.2, cellPadding: 1.1, overflow: "linebreak", valign: "top" },
        headStyles: { fontSize: 5.5 },
        margin: { left: 7, right: 7 },
        tableWidth: "auto",
      });
      doc.save(`FS_LOG_Base_Completa_${hojeISO()}.pdf`);
      setToast("Base completa exportada para PDF.");
      setTimeout(() => setToast(null), 2500);
    } catch (err) {
      setToast("Não foi possível gerar o PDF. Verifique a conexão e tente novamente.");
      setTimeout(() => setToast(null), 3500);
    }
  }

  return (
    <div className="app">
      <div className="shell">
        <div className="topbar">
          <div className="brand">
            <div className="brand-logo-card">
              <svg className="brand-logo-icon" viewBox="0 0 28 83" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <clipPath id="dropClip3">
                    <path d="M2,0 C-3,3 0,12 0,20 L0,62 C5,78 15,83 27,83 L28,20 C28,10 15,2 2,0 Z" />
                  </clipPath>
                  <linearGradient id="fsYellowG2" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stopColor="#f6e14c" />
                    <stop offset="100%" stopColor="#e8ca3c" />
                  </linearGradient>
                  <linearGradient id="fsGreenG2" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stopColor="#7cbf5f" />
                    <stop offset="100%" stopColor="#0f7a3e" />
                  </linearGradient>
                </defs>
                <g clipPath="url(#dropClip3)">
                  <path d="M0,0 L28,0 L28,27 C16,28 8,35 0,50 Z" fill="url(#fsYellowG2)" />
                  <path d="M0,50 C8,35 16,28 28,27 L28,83 L0,83 Z" fill="url(#fsGreenG2)" />
                </g>
              </svg>
              <div className="brand-logo-text">
                <div className="fs-wordmark"><span>FS</span></div>
                <span className="tagline">Fueling<br />Sustainability</span>
              </div>
            </div>
            <div>
              <h1>FS LOG Site SMT | Controle de Ações Corretivas &amp; Preventivas</h1>
            </div>
          </div>
          <div className="topbar-right">
            <div className="tabs">
              <button className={`tab-btn ${tab === "registro" ? "active" : ""}`} onClick={() => setTab("registro")}>
                <ListIcon size={15} /> Registro<span className="badge-count">{acoes.length}</span>
              </button>
              <button className={`tab-btn ${tab === "dashboard" ? "active" : ""}`} onClick={() => setTab("dashboard")}>
                <GridIcon size={15} /> Dashboard
              </button>
              <button className={`tab-btn ${tab === "agenda" ? "active" : ""}`} onClick={() => setTab("agenda")}>
                <CalendarIcon size={15} /> Agenda
              </button>
              <button className={`tab-btn ${tab === "relatorios" ? "active" : ""}`} onClick={() => setTab("relatorios")}>
                <FileTextIcon size={15} /> Relatórios
              </button>
              {isAdm && (
                <button className={`tab-btn ${tab === "usuarios" ? "active" : ""}`} onClick={() => setTab("usuarios")}>
                  <UsersIcon size={15} /> Usuários<span className="badge-count">{usuarios.length}</span>
                </button>
              )}
              {podeAcessarCobrancas && (
                <button className={`tab-btn ${tab === "cobrancas" ? "active" : ""}`} onClick={() => setTab("cobrancas")}>
                  <MailIcon size={15} /> Cobranças
                </button>
              )}
            </div>
            <button className="usuario-atual-btn" onClick={() => auth.signOut()} title="Clique para sair da conta">
              <UserIcon size={14} />
              <span className="usuario-atual-nome">{usuarioAtual ? usuarioAtual.nome.split(" ")[0] : (usuarioAuth.email || "").split("@")[0]}</span>
              {usuarioAtual && <span className={`pill ${isAdm ? "pill-altaalta" : "pill-baixa"}`} style={{ marginLeft: 2 }}>{isAdm ? "ADM" : "USER"}</span>}
            </button>
            <button className="theme-btn" onClick={() => setTema(tema === "claro" ? "escuro" : "claro")} title="Alternar tema">
              {tema === "claro" ? <MoonIcon size={17} /> : <SunIcon size={17} />}
            </button>
          </div>
        </div>

        {tab === "dashboard" && (
          <React.Fragment>
            <div className="stats-grid">
              <div className="stat-card">
                <div className="label">Total de Ações</div>
                <div className="value">{dash.total}</div>
              </div>
              <div className="stat-card">
                <div className="value ok">{dash.concluidas}</div>
                <div className="label" style={{ marginTop: 8, marginBottom: 0 }}>Concluídas</div>
                <div className="sub">{dash.total ? Math.round(dash.concluidas / dash.total * 100) : 0}% do total</div>
              </div>
              <div className="stat-card">
                <div className="value leak">{dash.pendentes}</div>
                <div className="label" style={{ marginTop: 8, marginBottom: 0 }}>Pendentes</div>
                <div className="sub">{dash.total ? Math.round(dash.pendentes / dash.total * 100) : 0}% do total</div>
              </div>
              <div className="stat-card">
                <div className="value amber">{dash.andamento}</div>
                <div className="label" style={{ marginTop: 8, marginBottom: 0 }}>Em Andamento</div>
                <div className="sub">{dash.total ? Math.round(dash.andamento / dash.total * 100) : 0}% do total</div>
              </div>
              <div className="stat-card">
                <div className="value leak">{dash.vencidas}</div>
                <div className="label" style={{ marginTop: 8, marginBottom: 0 }}>Vencidas</div>
                <div className="sub">Prazo (Quando? Até) já passou</div>
              </div>
              <div className="stat-card">
                <div className="value blue">{dash.tempoMedio !== null ? dash.tempoMedio : "—"}</div>
                <div className="label" style={{ marginTop: 8, marginBottom: 0 }}>Dias médios p/ concluir</div>
              </div>
            </div>

            <div className="charts-grid">
              <div className="chart-card">
                <div className="chart-card-head"><h3>Importância das Ações</h3></div>
                <div className="chart-card-body">
                  <BarChart
                    labels={dash.graficoImportancia.labels}
                    data={dash.graficoImportancia.data}
                    colors={dash.graficoImportancia.colors}
                    isLight={tema === "claro"}
                  />
                </div>
              </div>

              <div className="chart-card">
                <div className="chart-card-head"><h3>Status de Fechamento</h3></div>
                <div className="chart-card-body">
                  <BarChart
                    labels={dash.graficoStatus.labels}
                    data={dash.graficoStatus.data}
                    colors={dash.graficoStatus.colors}
                    isLight={tema === "claro"}
                  />
                </div>
              </div>

              <div className="chart-card">
                <div className="chart-card-head"><h3>"DIAS" Fechamento das Ações</h3></div>
                <div className="chart-card-body">
                  <BarChart
                    labels={dash.graficoTempo.map((r) => r.label)}

                    <select className="filtro-input" value={filtrosColuna.importancia || ""} onChange={(e) => setFiltroColuna("importancia", e.target.value)}>
                      <option value="">Todas</option>
                      {IMPORTANCIAS.map((i) => <option key={i} value={i}>{importanciaLabel(i)}</option>)}
                    </select>
                  </td>
                  <td>
                    <select className="filtro-input" value={filtrosColuna.status || ""} onChange={(e) => setFiltroColuna("status", e.target.value)}>
                      <option value="">Todos</option>
                      {STATUS_OPCOES.map((s) => <option key={s} value={s}>{statusLabel(s)}</option>)}
                    </select>
                  </td>
                  <td><input className="filtro-input" type="text" placeholder="dd/mm" value={filtrosColuna.quandoAte || ""} onChange={(e) => setFiltroColuna("quandoAte", e.target.value)} /></td>
                  <td>
                    <select className="filtro-input" value={filtrosColuna.responsavel || ""} onChange={(e) => setFiltroColuna("responsavel", e.target.value)}>
                      <option value="">Todos</option>
                      {usuarios.map((u) => <option key={u.id} value={u.nome}>{u.nome}</option>)}
                    </select>
                  </td>
                  <td><input className="filtro-input" type="text" placeholder="dd/mm" value={filtrosColuna.dataConclusao || ""} onChange={(e) => setFiltroColuna("dataConclusao", e.target.value)} /></td>
                  <td></td>
                  <td>
                    <select className="filtro-input" value={filtrosColuna.postergar || ""} onChange={(e) => setFiltroColuna("postergar", e.target.value)}>
                      <option value="">Todos</option>
                      <option value="SIM">Sim</option>
                      <option value="NÃO">Não</option>
                    </select>
                  </td>
                  <td><input className="filtro-input" type="text" placeholder="Buscar…" value={filtrosColuna.justificativa || ""} onChange={(e) => setFiltroColuna("justificativa", e.target.value)} /></td>
                  <td><input className="filtro-input" type="text" placeholder="Buscar…" value={filtrosColuna.eficacia || ""} onChange={(e) => setFiltroColuna("eficacia", e.target.value)} /></td>
                  <td></td>
                </tr></thead>
                <tbody>
                  {acoesFiltradas.map((a) => (
                    <tr key={a.id}>
                      <td className="td-compact"><span className="item-tag">{a.item}</span></td>
                      <td className="td-compact">{isAdm ? (
                        <input className="inline-edit" type="date" value={a.data || ""}
                          onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                          onKeyDown={impedirDigitacaoData} onPaste={(e) => e.preventDefault()} onDrop={(e) => e.preventDefault()}
                          onChange={(e) => atualizarCampoInline(a.id, "data", e.target.value)} />
                      ) : (a.data ? fmtBR(a.data) : "—")}</td>
                      <td className="td-compact">{a.origem || "—"}</td>
                      <td className="acao-cell">{isAdm ? (
                        <textarea className="inline-edit" defaultValue={a.acao || ""}
                          onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                          onBlur={(e) => atualizarCampoInline(a.id, "acao", e.target.value)} />
                      ) : <span className="acao-title">{a.acao}</span>}</td>
                      <td className="wrap-cell detalhe-cell">{a.descricao ? (
                        <span className="wrap-box detalhe-scroll" title="Use a roda do mouse ou a barra lateral para ler todo o detalhamento / como executar">{a.descricao}</span>
                      ) : ((isAdm || usuarioEhResponsavelDaAcao(a)) ? (
                        <textarea className="inline-edit detalhe-edit-vazio" defaultValue=""
                          placeholder="Preencher detalhamento..."
                          onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                          onBlur={(e) => { const v = e.target.value.trim(); if (v) atualizarCampoInline(a.id, "descricao", v); }} />
                      ) : <span className="cell-empty">—</span>)}</td>
                      <td className="wrap-cell fup-cell">{isAdm ? (
                        <textarea className="inline-edit fup-edit" defaultValue={a.fup || ""}
                          onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                          placeholder="O que foi feito (FUP)" onBlur={(e) => atualizarCampoInline(a.id, "fup", e.target.value)} />
                      ) : (a.fup ? <span className="wrap-box fup-scroll" title="Use a roda do mouse ou a barra lateral para ler todo o FUP">{a.fup}</span> : <span className="cell-empty">—</span>)}</td>
                      <td className="td-compact">
                        <div className="evidencias-cell" onClick={(e) => { e.stopPropagation(); abrirEvidencias(a); }}>
                          {(a.evidencias || []).length === 0 ? (
                            <span className="evidencias-add"><ImageIcon size={14} /></span>
                          ) : (
                            <React.Fragment>
                              {(a.evidencias || []).slice(0, 3).map((ev) => (
                                <span className="evidencia-thumb" key={ev.id}>
                                  {ev.tipo === "imagem" ? <img src={ev.url} alt="" /> : <span className="evidencia-video-thumb"><VideoIcon size={11} /></span>}
                                </span>
                              ))}
                              {(a.evidencias || []).length > 3 && <span className="evidencia-mais">+{(a.evidencias || []).length - 3}</span>}
                            </React.Fragment>
                          )}
                        </div>
                      </td>
                      <td className="td-compact">{isAdm ? (
                        <input className="inline-edit" type="date" value={a.dataStart || ""}
                          onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                          onKeyDown={impedirDigitacaoData} onPaste={(e) => e.preventDefault()} onDrop={(e) => e.preventDefault()}
                          onChange={(e) => atualizarCampoInline(a.id, "dataStart", e.target.value)} />
                      ) : (a.dataStart ? fmtBR(a.dataStart) : "—")}</td>
                      <td className="td-compact">{isAdm ? (
                        <select className={`inline-edit pill ${importanciaClasse(a.importancia)}`} value={a.importancia || "B) Alta"}
                          onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                          onChange={(e) => atualizarCampoInline(a.id, "importancia", e.target.value)}
                          style={{ cursor: "pointer", fontWeight: 700 }}>
                          <option value="D) Baixa">Baixa</option>
                          <option value="C) Média">Média</option>
                          <option value="B) Alta">Alta</option>
                          <option value="A) Alta Alta">Alta Alta</option>
                        </select>
                      ) : <span className={`pill ${importanciaClasse(a.importancia)}`}>{importanciaLabel(a.importancia)}</span>}</td>
                      <td className="td-compact">
                        <select
                          className={`pill ${statusClasse(a.status)}`}
                          value={a.status}
                          onClick={(e) => e.stopPropagation()}
                          onChange={(e) => mudarStatusRapido(a, e.target.value)}
                          style={{ border: "none", cursor: "pointer" }}
                        >
                          {STATUS_OPCOES.map((s) => <option key={s} value={s}>{statusLabel(s)}</option>)}
                        </select>
                      </td>
                      <td className="td-compact">
                        {isAdm ? (
                          <input className="inline-edit" type="date" value={a.quandoAte || ""}
                            onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                            onKeyDown={impedirDigitacaoData} onPaste={(e) => e.preventDefault()} onDrop={(e) => e.preventDefault()}
                            onChange={(e) => atualizarCampoInline(a.id, "quandoAte", e.target.value)} />
                        ) : (a.quandoAte ? fmtBR(a.quandoAte) : "—")}
                        {estaVencida(a) && <div className="pill pill-vencida" style={{ marginTop: 4 }}><AlertIcon size={10} /> Vencida</div>}
                      </td>
                      <td className="td-compact responsavel-cell">
                        {isAdm ? (
                          <details className="resp-picker" onClick={(e) => e.stopPropagation()} onPointerDown={(e) => e.stopPropagation()}>
                            <summary title={a.responsavel || "Selecione um ou mais responsáveis"}>
                              {a.responsavel || <span className="resp-picker-empty">Selecionar responsável</span>}
                            </summary>
                            <div className="resp-picker-menu">
                              {Array.from(new Set([
                                ...listarResponsaveis(a.responsavel),
                                ...usuarios.slice().sort((u1, u2) => (u1.nome || "").localeCompare(u2.nome || "", "pt-BR")).map((u) => u.nome)
                              ])).filter(Boolean).map((nome) => {
                                const selecionados = listarResponsaveis(a.responsavel);
                                const marcado = selecionados.includes(nome);
                                return (
                                  <label className="resp-picker-option" key={nome}>
                                    <input type="checkbox" checked={marcado}
                                      onChange={(e) => {
                                        const proximos = e.target.checked
                                          ? [...selecionados, nome]
                                          : selecionados.filter((n) => n !== nome);
                                        atualizarCampoInline(a.id, "responsavel", juntarResponsaveis(proximos));
                                      }} />
                                    <span>{nome}</span>
                                  </label>
                                );
                              })}
                            </div>
                          </details>
                        ) : (
                          <span>{a.responsavel || "—"}</span>
                        )}
                      </td>
                      <td className="td-compact">{isAdm ? (
                        <input className="inline-edit" type="date" value={a.dataConclusao || ""}
                          onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                          onKeyDown={impedirDigitacaoData} onPaste={(e) => e.preventDefault()} onDrop={(e) => e.preventDefault()}
                          onChange={(e) => atualizarCampoInline(a.id, "dataConclusao", e.target.value)} />
                      ) : (a.dataConclusao ? fmtBR(a.dataConclusao) : "—")}</td>
                      <td className="td-compact">{a.dataStart ? `${diasAbertos(a)} dia(s)` : "—"}</td>
                      <td className="td-compact">{isAdm ? (
                        <select className="inline-edit" value={a.postergar || "NÃO"}
                          onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                          onChange={(e) => atualizarCampoInline(a.id, "postergar", e.target.value)}>
                          <option value="NÃO">NÃO</option><option value="SIM">SIM</option>
                        </select>
                      ) : <span className={`pill ${a.postergar === "SIM" ? "pill-alta" : "pill-media"}`}>{a.postergar || "NÃO"}</span>}</td>
                      <td className="wrap-cell">{isAdm ? (
                        <textarea className="inline-edit" defaultValue={a.justificativa || ""}
                          onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                          placeholder="Justificativa" onBlur={(e) => atualizarCampoInline(a.id, "justificativa", e.target.value)} />
                      ) : (a.justificativa ? <span className="wrap-box">{a.justificativa}</span> : <span className="cell-empty">—</span>)}</td>
                      <td className="wrap-cell">{isAdm ? (
                        <textarea className="inline-edit" defaultValue={a.eficacia || ""}
                          onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}
                          placeholder="Eficácia da implementação" onBlur={(e) => atualizarCampoInline(a.id, "eficacia", e.target.value)} />
                      ) : (a.eficacia ? <span className="wrap-box">{a.eficacia}</span> : <span className="cell-empty">—</span>)}</td>
                      <td className="td-compact">
                        {isAdm ? (
                          <>
                            <button className="btn-ghost" onClick={(e) => { e.stopPropagation(); abrirEdicao(a); }} title="Editar ação" style={{ marginRight: 6 }}><PencilIcon size={13} /></button>
                            <button className="btn-ghost" onClick={(e) => { e.stopPropagation(); excluir(a); }} title="Excluir ação"><TrashIcon size={13} /></button>
                          </>
                        ) : usuarioEhResponsavelDaAcao(a) ? (
                          <button className="btn-ghost" onClick={(e) => { e.stopPropagation(); abrirEdicao(a); }} title="Editar minha ação"><PencilIcon size={13} /></button>
                        ) : (
                          <span className="btn-ghost" style={{ opacity: 0.4, cursor: "not-allowed" }} title="Você não é responsável por esta ação"><LockIcon size={12} /></span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table></div>
            )}
          </div>
        )}
      </div>

      {toast && <div className="toast"><CheckIcon size={15} />{toast}</div>}

      {modalAberto && (
        <div className="modal-backdrop" onClick={fecharModal}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-head">
              <h3>{editando ? "Editar Ação" : "Nova Ação"}</h3>
              <button className="btn-ghost" onClick={fecharModal}><XIcon size={14} /> Fechar</button>
            </div>
            <form className="modal-form" onSubmit={salvar}>
              <div className="modal-body"><div className="modal-body-inner">
                {subAcaoDe && (
                  <div className="subacao-tag">
                    <PlusIcon size={13} /> Sub Ação de <b>{subAcaoDe.item}</b> — {subAcaoDe.acao.slice(0, 70)}{subAcaoDe.acao.length > 70 ? "…" : ""}
                  </div>
                )}
                {erro && <div className="err"><AlertIcon size={15} />{erro}</div>}

                <div className="grid3">
                  <div className="field"><label>Item</label>
                    <input type="text" placeholder="ex: 4.1" value={form.item} onChange={(e) => setForm({ ...form, item: e.target.value })} />
                  </div>
                  <div className="field campo-bloqueado"><label>Data de Registro</label>
                    <input type="date" value={form.data} disabled={campoBloqueadoParaUser("data")} onKeyDown={(e) => e.preventDefault()} onPaste={(e) => e.preventDefault()} onDrop={(e) => e.preventDefault()} onClick={(e) => { if (!e.currentTarget.disabled && e.currentTarget.showPicker) e.currentTarget.showPicker(); }} onChange={(e) => setForm({ ...form, data: e.target.value })} />
                  </div>
                  <div className="field campo-bloqueado"><label>Evento</label>
                    <select
                      value={ORIGENS.includes(form.origem) ? form.origem : "Outro"}
                      disabled={campoBloqueadoParaUser("origem")}
                      onChange={(e) => setForm({ ...form, origem: e.target.value === "Outro" ? "" : e.target.value })}
                    >
                      {ORIGENS.map((o) => <option key={o} value={o}>{o}</option>)}
                    </select>
                    {!ORIGENS.includes(form.origem) && (
                      <input
                        type="text"
                        placeholder="Especifique o evento"
                        value={form.origem}
                        disabled={campoBloqueadoParaUser("origem")}
                        onChange={(e) => setForm({ ...form, origem: e.target.value })}
                        style={{ marginTop: 8 }}
                        autoFocus
                      />
                    )}
                  </div>
                </div>

                <div className="field campo-bloqueado"><label>Ação <span className="req">*</span></label>
                  <textarea placeholder="O que precisa ser feito?" value={form.acao} disabled={campoBloqueadoParaUser("acao")} onChange={(e) => setForm({ ...form, acao: e.target.value })} />
                </div>
                <div className="field campo-bloqueado"><label>Detalhamento | Como executar</label>
                  <textarea placeholder="Detalhes adicionais, notas de contexto…" value={form.descricao} disabled={campoBloqueadoParaUser("descricao")} onChange={(e) => setForm({ ...form, descricao: e.target.value })} />
                </div>
                <div className="field campo-bloqueado"><label>O que foi feito (FUP)</label>
                  <textarea placeholder="Acompanhamento / follow-up do que já foi realizado" value={form.fup} onChange={(e) => setForm({ ...form, fup: e.target.value })} />
                </div>

                {camposBloqueados && (
                  <div className="campo-bloqueado-aviso" style={{ marginBottom: 14 }}>
                    <LockIcon size={12} />
                    Você pode atualizar somente ações em que seja responsável ou um dos responsáveis. Data, Evento, Ação, Data (Start), Importância e Responsável são restritos ao ADM. O Detalhamento | Como Executar pode ser preenchido pelo responsável apenas enquanto estiver vazio; depois disso fica bloqueado para USER.
                  </div>
                )}

                <div className="grid2">
                  <div className="field campo-bloqueado"><label>Importância</label>
                    <select value={form.importancia} disabled={campoBloqueadoParaUser("importancia")} onChange={(e) => setForm({ ...form, importancia: e.target.value })}>
                      {IMPORTANCIAS.map((i) => <option key={i} value={i}>{importanciaLabel(i)}</option>)}
                    </select>
                  </div>
                  <div className="field"><label>Status</label>
                    <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
                      {STATUS_OPCOES.map((s) => <option key={s} value={s}>{statusLabel(s)}</option>)}
                    </select>
                  </div>
                </div>

                <div className="grid3">
                  <div className="field campo-bloqueado"><label>Data (Start)</label>
                    <input type="date" value={form.dataStart} disabled={campoBloqueadoParaUser("dataStart")} onChange={(e) => setForm({ ...form, dataStart: e.target.value })} />
                  </div>
                  <div className="field campo-bloqueado"><label>Quando? (Até)</label>
                    <input type="date" value={form.quandoAte} onKeyDown={(e) => e.preventDefault()} onPaste={(e) => e.preventDefault()} onDrop={(e) => e.preventDefault()} onClick={(e) => { if (!e.currentTarget.disabled && e.currentTarget.showPicker) e.currentTarget.showPicker(); }} onChange={(e) => setForm({ ...form, quandoAte: e.target.value })} />
                  </div>
                  <div className="field campo-bloqueado"><label>Data de Conclusão</label>
                    <input type="date" value={form.dataConclusao} onKeyDown={(e) => e.preventDefault()} onPaste={(e) => e.preventDefault()} onDrop={(e) => e.preventDefault()} onClick={(e) => { if (!e.currentTarget.disabled && e.currentTarget.showPicker) e.currentTarget.showPicker(); }} onChange={(e) => setForm({ ...form, dataConclusao: e.target.value })} />
                  </div>
                </div>

                {form.dataStart && (
                  <div className="tempo-aberto-info">
                    <ClockIcon size={14} />
                    <span><strong>Tempo Ação Aberta:</strong> {diasAbertos(form) ?? 0} dia(s) {form.dataConclusao ? "(Data de Conclusão − Data Start)" : "(Hoje − Data Start, ainda sem conclusão)"}</span>
                  </div>
                )}

                <div className="field campo-bloqueado"><label>Responsável <span className="req">*</span></label>
                  <select multiple size="6" value={listarResponsaveis(form.responsavel)} disabled={campoBloqueadoParaUser("responsavel")}
                    onChange={(e) => setForm({ ...form, responsavel: juntarResponsaveis(Array.from(e.target.selectedOptions).map((o) => o.value)) })}
                    title="Selecione um ou mais responsáveis (Ctrl para múltiplos no Windows)">
                    {listarResponsaveis(form.responsavel).filter((nome) => !usuarios.some((u) => u.nome === nome)).map((nome) => (
                      <option key={`legado-form-${nome}`} value={nome}>{nome}</option>
                    ))}
                    {usuarios.slice().sort((u1,u2) => (u1.nome || "").localeCompare(u2.nome || "", "pt-BR")).map((u) => <option key={u.id} value={u.nome}>{u.nome}</option>)}
                  </select>
                  {!campoBloqueadoParaUser("responsavel") && <div style={{ fontSize: 12, color: "var(--text-faint)", marginTop: 6 }}>Você pode selecionar mais de um responsável. No Windows, mantenha Ctrl pressionado ao clicar nos nomes.</div>}
                  {usuarios.length === 0 && (
                    <div style={{ fontSize: 12.5, color: "var(--text-dim)", marginTop: 6 }}>
                      Nenhum usuário cadastrado. <button type="button" className="btn-ghost" style={{ padding: "2px 8px" }} onClick={() => { setModalAberto(false); setTab("usuarios"); abrirNovoUsuario(); }}>Cadastrar responsável</button>
                    </div>
                  )}
                </div>

                <div className="grid2">
                  <div className="field campo-bloqueado"><label>Necessário Postergar?</label>
                    <select value={form.postergar} onChange={(e) => setForm({ ...form, postergar: e.target.value })}>
                      <option value="NÃO">NÃO</option>
                      <option value="SIM">SIM</option>
                    </select>
                  </div>
                  <div className="field campo-bloqueado"><label>Justificativa do Postergamento</label>
                    <input type="text" value={form.justificativa} onChange={(e) => setForm({ ...form, justificativa: e.target.value })} />
                  </div>
                </div>

                <div className="field campo-bloqueado"><label>Eficácia da Implementação</label>
                  <textarea placeholder="Resultado obtido após a ação concluída" value={form.eficacia} onChange={(e) => setForm({ ...form, eficacia: e.target.value })} />
                </div>
              </div></div>
              <div className="modal-foot">
                {editando
                  ? (isAdm
                    ? <button type="button" className="btn-danger" onClick={() => excluir(form)}><TrashIcon size={14} /> Excluir</button>
                    : <span style={{ fontSize: 12, color: "var(--text-faint)", display: "flex", alignItems: "center", gap: 5 }}><LockIcon size={12} /> Excluir é restrito a usuários ADM</span>)
                  : <span></span>}
                <button type="submit" className="btn-primary"><CheckIcon size={16} /> {editando ? "Salvar Alterações" : "Registrar Ação"}</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {seletorSubAcaoAberto && (
        <div className="picker-backdrop" onClick={fecharSeletorSubAcao}>
          <div className="picker-modal" onClick={(e) => e.stopPropagation()}>
            <div className="picker-head">
              <div>
                <h3>Escolha a ação-pai</h3>
                <p>Selecione a ação que receberá a nova sub ação.</p>
              </div>
              <button className="btn-ghost" onClick={fecharSeletorSubAcao}><XIcon size={14} /> Fechar</button>
            </div>
            <div className="picker-search">
              <input
                type="text"
                autoFocus
                placeholder="Buscar por ação, item ou responsável…"
                value={buscaSubAcao}
                onChange={(e) => setBuscaSubAcao(e.target.value)}
              />
            </div>
            <div className="picker-list">
              {acoesParaSelecionarPai.length === 0 ? (
                <div className="empty">Nenhuma ação encontrada.</div>
              ) : acoesParaSelecionarPai.map((a) => (
                <div className="picker-item" key={a.id} onClick={() => escolherPaiSubAcao(a)}>
                  <div className="pi-top">
                    <span className="pi-item">{a.item}</span>
                    <span className="pi-acao" title={a.acao}>{a.acao}</span>
                  </div>
                  <div className="pi-meta">{a.responsavel} · {statusLabel(a.status)} · próximo item: {proximoSubItem(a.item)}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {reuniaoModalAberto && formReuniao && (
        <div className="picker-backdrop" onClick={fecharModalReuniao}>
          <div className="picker-modal" style={{ maxWidth: 680 }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-head">
              <h3>{reuniaoEditando ? "Editar Reunião" : "Nova Reunião"}</h3>
              <button className="btn-ghost" onClick={fecharModalReuniao}><XIcon size={14} /> Fechar</button>
            </div>
            <form onSubmit={salvarReuniao} style={{ display: "flex", flexDirection: "column", flex: "1 1 auto", minHeight: 0 }}>
              <div className="modal-body" style={{ maxHeight: "68vh" }}>
                {erroReuniao && <div className="err"><AlertIcon size={15} />{erroReuniao}</div>}

                <div className="field"><label>Assunto da Reunião <span className="req">*</span></label>
                  <input type="text" placeholder="ex: Reunião de KPIs — Revisão do Plano de Ações"
                    value={formReuniao.titulo} onChange={(e) => setFormReuniao({ ...formReuniao, titulo: e.target.value })} />
                </div>

                <div className="grid3">
                  <div className="field"><label>Data <span className="req">*</span></label>
                    <input type="date" value={formReuniao.data} onChange={(e) => setFormReuniao({ ...formReuniao, data: e.target.value })} />
                  </div>
                  <div className="field"><label>Hora Início</label>
                    <input type="time" value={formReuniao.horaInicio} onChange={(e) => setFormReuniao({ ...formReuniao, horaInicio: e.target.value })} />
                  </div>
                  <div className="field"><label>Hora Fim</label>
                    <input type="time" value={formReuniao.horaFim} onChange={(e) => setFormReuniao({ ...formReuniao, horaFim: e.target.value })} />
                  </div>
                </div>

                <div className="grid2">
                  <div className="field"><label>Local / Link</label>
                    <input type="text" placeholder="ex: Sala de Reuniões · Site SMT ou Google Meet"
                      value={formReuniao.local} onChange={(e) => setFormReuniao({ ...formReuniao, local: e.target.value })} />
                  </div>
                  <div className="field"><label>Status</label>
                    <select value={formReuniao.status} onChange={(e) => setFormReuniao({ ...formReuniao, status: e.target.value })}>
                      <option value="Agendada">Agendada</option>
                      <option value="Concluída">Concluída</option>
                      <option value="Cancelada">Cancelada</option>
                    </select>
                  </div>
                </div>

                <div className="field"><label>Participantes</label>
                  <input type="text" placeholder="ex: Anderson Botega, Hevily Tainara Motter"
                    value={formReuniao.participantes} onChange={(e) => setFormReuniao({ ...formReuniao, participantes: e.target.value })} />
                </div>

                <div className="field"><label>Pauta / Descrição</label>
                  <textarea placeholder="O que será tratado nesta reunião…"
                    value={formReuniao.descricao} onChange={(e) => setFormReuniao({ ...formReuniao, descricao: e.target.value })} />
                </div>
              </div>
              <div className="modal-foot">
                {reuniaoEditando
                  ? <button type="button" className="btn-danger" onClick={() => excluirReuniao(formReuniao)}><TrashIcon size={14} /> Excluir</button>
                  : <span></span>}
                <button type="submit" className="btn-primary"><CheckIcon size={16} /> {reuniaoEditando ? "Salvar Alterações" : "Agendar Reunião"}</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {usuarioModalAberto && (
        <div className="picker-backdrop" onClick={fecharModalUsuario}>
          <div className="picker-modal" style={{ maxWidth: 460 }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-head">
              <h3>{usuarioEditando ? "Editar Usuário" : "Novo Usuário"}</h3>
              <button className="btn-ghost" onClick={fecharModalUsuario}><XIcon size={14} /> Fechar</button>
            </div>
            <form onSubmit={salvarUsuario} style={{ display: "flex", flexDirection: "column", flex: "1 1 auto", minHeight: 0 }}>
              <div className="modal-body">
                {erroUsuario && <div className="err"><AlertIcon size={15} />{erroUsuario}</div>}
                <div className="field"><label>Nome <span className="req">*</span></label>
                  <input type="text" placeholder="ex: Maria da Silva"
                    value={formUsuario.nome} onChange={(e) => setFormUsuario({ ...formUsuario, nome: e.target.value })} />
                </div>
                <div className="field"><label>Função</label>
                  <input type="text" placeholder="ex: Coordenador, Supervisor, Colaborador…" list="lista-funcoes"
                    value={formUsuario.funcao} onChange={(e) => setFormUsuario({ ...formUsuario, funcao: e.target.value })} />
                  <datalist id="lista-funcoes">
                    {Array.from(new Set(usuarios.map((u) => u.funcao).filter(Boolean))).map((f) => <option key={f} value={f} />)}
                  </datalist>
                </div>
                <div className="field"><label>Perfil de Acesso</label>
                  <select value={formUsuario.perfil} onChange={(e) => setFormUsuario({ ...formUsuario, perfil: e.target.value })}>
                    <option value="USER">Usuário (USER)</option>
                    <option value="ADM">Administrador (ADM)</option>
                  </select>
                  <div style={{ fontSize: 12, color: "var(--text-dim)", marginTop: 6 }}>
                    Apenas usuários com perfil <strong>ADM</strong> podem editar os campos principais e excluir ações já cadastradas.
                  </div>
                </div>
                <div className="field"><label>E-mail de login <span className="req">*</span></label>
                  <input type="text" placeholder="ex: maria.silva@fs.agr.br"
                    value={formUsuario.email} onChange={(e) => setFormUsuario({ ...formUsuario, email: e.target.value })} />
                  <div style={{ fontSize: 12, color: "var(--text-dim)", marginTop: 6 }}>
                    Use exatamente o mesmo e-mail com o qual a pessoa vai entrar no app. A conta de login (senha) é criada
                    no <strong>Firebase Console → Authentication → Users → Add user</strong> — este cadastro aqui só
                    define o nome, a função e o perfil de acesso dela dentro do app.
                  </div>
                </div>
              </div>
              <div className="modal-foot">
                {usuarioEditando
                  ? <button type="button" className="btn-danger" onClick={() => excluirUsuario({ id: usuarioEditando, nome: formUsuario.nome })}><TrashIcon size={14} /> Excluir</button>
                  : <span></span>}
                <button type="submit" className="btn-primary"><CheckIcon size={16} /> {usuarioEditando ? "Salvar Alterações" : "Cadastrar Usuário"}</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {acaoEvidencias && (
        <div className="picker-backdrop" onClick={fecharEvidencias}>
          <div className="picker-modal evid-modal" onClick={(e) => e.stopPropagation()}>
            <div className="picker-head">
              <div>
                <h3>Evidências</h3>
                <p>{acaoEvidencias.acao ? acaoEvidencias.acao.slice(0, 70) : `Item ${acaoEvidencias.item}`} · até {MAX_IMAGENS} imagens e {MAX_VIDEOS} vídeos</p>
              </div>
              <button className="btn-ghost" onClick={fecharEvidencias}><XIcon size={14} /> Fechar</button>
            </div>

            <label className="evid-upload-box">
              <input type="file" accept="image/*,video/*" style={{ display: "none" }}
                onChange={(e) => { const f = e.target.files[0]; if (f) enviarEvidencia(acaoEvidencias, f); e.target.value = ""; }} />
              <UploadIcon size={16} style={{ marginBottom: 4 }} /><br />
              {evidenciaUpload ? `Enviando… ${evidenciaUpload.progresso}%` : "Clique para anexar uma foto ou vídeo"}
            </label>

            {(acaoEvidencias.evidencias || []).length === 0 ? (
              <div className="evid-empty">Nenhuma evidência anexada ainda.</div>
            ) : (
              <div className="evid-grid">
                {(acaoEvidencias.evidencias || []).map((ev) => (
                  <div className="evid-item" key={ev.id} onClick={() => setEvidenciaAmpliada(ev)}>
                    {ev.tipo === "imagem" ? <img src={ev.url} alt={ev.nome} /> : <video src={ev.url} muted />}
                    {ev.tipo === "video" && <span className="evid-item-video-marker"><VideoIcon size={11} /></span>}
                    {usuarioEhResponsavelDaAcao(acaoEvidencias) && (
                      <button className="evid-item-del" title="Excluir evidência" onClick={(e) => { e.stopPropagation(); removerEvidencia(acaoEvidencias, ev); }}><TrashIcon size={11} /></button>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {evidenciaAmpliada && (
        <div className="evid-lightbox-backdrop" onClick={() => setEvidenciaAmpliada(null)}>
          <div className="evid-lightbox-content" onClick={(e) => e.stopPropagation()}>
            {evidenciaAmpliada.tipo === "imagem"
              ? <img src={evidenciaAmpliada.url} alt={evidenciaAmpliada.nome} />
              : <video src={evidenciaAmpliada.url} controls autoPlay />}
          </div>
        </div>
      )}

    </div>
  );
}

/* ---------- Autenticação (Firebase Auth) ---------- */
function traduzErroAuth(err) {
  const c = err && err.code;
  if (c === "auth/invalid-email") return "E-mail inválido.";
  if (c === "auth/user-disabled") return "Este usuário está desativado.";
  if (c === "auth/user-not-found" || c === "auth/wrong-password" || c === "auth/invalid-credential") return "E-mail ou senha incorretos.";
  if (c === "auth/too-many-requests") return "Muitas tentativas. Aguarde um pouco e tente novamente.";
  if (c === "auth/network-request-failed") return "Falha de conexão. Verifique sua internet.";
  return (err && err.message) || "Não foi possível entrar. Tente novamente.";
}

function TelaLogin() {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  function entrar(e) {
    e.preventDefault();
    setErro("");
    if (!email.trim() || !senha) { setErro("Informe e-mail e senha."); return; }
    setCarregando(true);
    auth.signInWithEmailAndPassword(email.trim(), senha)
      .catch((err) => setErro(traduzErroAuth(err)))
      .finally(() => setCarregando(false));
  }

  return (
    <div className="app" style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
      <div className="card" style={{ maxWidth: 380, width: "100%" }}>
        <div className="card-head" style={{ flexDirection: "column", alignItems: "flex-start" }}>
          <h2>FS LOG · Controle de Ações</h2>
          <div className="sub">Entre com seu e-mail e senha cadastrados</div>
        </div>
        <form onSubmit={entrar} className="modal-form">
          <div className="modal-body">
            {erro && <div className="err"><AlertIcon size={15} />{erro}</div>}
            <div className="field"><label>E-mail</label>
              <input type="text" autoFocus placeholder="seu.nome@fs.agr.br" value={email} onChange={(e) => setEmail(e.target.value)} />
            </div>
            <div className="field"><label>Senha</label>
              <input type="password" placeholder="Sua senha" value={senha} onChange={(e) => setSenha(e.target.value)} />
            </div>
          </div>
          <div className="modal-foot" style={{ justifyContent: "space-between", gap: 10 }}>
            <button type="button" className="btn-ghost" onClick={() => { if (window.history.length > 1) window.history.back(); else window.location.href = window.location.origin + window.location.pathname; }}>
              ← Retornar para Registros
            </button>
            <button type="submit" className="btn-primary" disabled={carregando}>
              <CheckIcon size={16} /> {carregando ? "Entrando…" : "Entrar"}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

function TelaCarregando() {
  return (
    <div style={{ color: "#8f98ab", fontFamily: "sans-serif", padding: 40, textAlign: "center" }}>Carregando aplicativo…</div>
  );
}

function Raiz() {
  const [usuarioAuth, setUsuarioAuth] = useState(undefined); // undefined = ainda checando
  useEffect(() => auth.onAuthStateChanged(setUsuarioAuth), []);
  if (usuarioAuth === undefined) return <TelaCarregando />;
  if (usuarioAuth === null) return <TelaLogin />;
  return <App usuarioAuth={usuarioAuth} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Raiz />);
</script>
</body>
