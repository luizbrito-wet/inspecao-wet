<script type="text/babel">
const { useState, useMemo, useRef, useEffect, useCallback } = React;

/* =========================================================================
   CONFIGURAÇÃO
   ========================================================================= */
const CONFIG = {
  FILE_NAME_MATCH: "WETSMT",
  SHEET_NAME: null,
  REFRESH_MS: 5 * 60 * 1000,
  STATUS_PERMITIDOS: ["Finalizado", "Aguardando Faturamento"],
  EMAIL_ALERTA: "triagemsorriso@fs.agr.br",

const FILIAIS = ["1002-SMT"];
const MAX_VIDEOS = 3;
const MAX_IMAGES = 15;
const RODANDO_EM_IFRAME = typeof window !== "undefined" && (() => {
  try { return window.self !== window.top; } catch (e) { return true; }
})();
const SUPORTA_PASTA = typeof window !== "undefined" && "showDirectoryPicker" in window && !RODANDO_EM_IFRAME;

/* ---------- ícones (SVG inline) ---------- */
const Icon = ({ children, size = 16, ...p }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>{children}</svg>
);
const VideoIcon = (p) => <Icon {...p}><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></Icon>;
const CameraIcon = (p) => <Icon {...p}><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></Icon>;
const UploadIcon = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></Icon>;
const MailIcon = (p) => <Icon {...p}><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></Icon>;

function formatBytes(bytes) {

/* ---------- IndexedDB: guarda os arquivos de evidência de verdade,
   para poder abrir/baixar depois no Histórico ---------- */
const DB_NAME = "wet_inspecao_db";
const STORE_NAME = "evidencias";
function abrirDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE_NAME, { keyPath: "inspecaoId" }); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function salvarEvidencias(inspecaoId, files) {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put({ inspecaoId, arquivos: files.map((f) => ({ name: f.name, type: f.type, size: f.size, blob: f })) });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function obterEvidencias(inspecaoId) {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).get(inspecaoId);
    req.onsuccess = () => resolve(req.result ? req.result.arquivos : []);
    req.onerror = () => reject(req.error);
  });
}
async function excluirEvidencias(inspecaoId) {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).delete(inspecaoId);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* =========================================================================
   LEITURA LOCAL DO EXCEL (File System Access API + SheetJS)
   A pasta escolhida deve ser a pasta do OneDrive sincronizada no computador.
   Funciona apenas no Chrome / Edge.
   ========================================================================= */
function formatCelulaData(v) {
  if (v instanceof Date) return v.toLocaleDateString("pt-BR");
  if (typeof v === "number") { const d = new Date(Math.round((v - 25569) * 86400 * 1000)); return d.toLocaleDateString("pt-BR"); }
  return v == null ? "" : String(v).trim();
}
function formatCelulaHora(v) {
  if (v instanceof Date) return v.toLocaleTimeString("pt-BR");
  return v == null ? "" : String(v).trim();
}
function parseLinhasPlanilha(rows) {
  if (!rows || rows.length < 2) return [];
  const headers = rows[0].map((h) => String(h ?? "").trim());
  const idx = (nome) => headers.indexOf(nome);
  const iRomaneio = idx("Romaneio"), iFilial = idx("Filial"), iStatus = idx("Denominação Status"),
    iMaterial = idx("Denominação Material"), iQtd = idx("Quantidade prevista"), iUme = idx("UMB"),
    iPlaca = idx("Placa do cavalo"), iPlacaCarreta = idx("Placa da carreta"), iTerceiraPlaca = idx("Terceira Placa do Caminhão"),
    iPesoBruto = idx("Peso Bruto"), iPesoTara = idx("Peso Tara"),
    iData = idx("Data de criação"), iHora = idx("Criado às:");
  const cargas = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || row.length === 0) continue;
    const status = String(row[iStatus] ?? "").trim();
    if (!CONFIG.STATUS_PERMITIDOS.includes(status)) continue;
    cargas.push({
      romaneio: String(row[iRomaneio] ?? "").trim(),
      filial: String(row[iFilial] ?? "").trim(),
      status,
      material: iMaterial >= 0 ? String(row[iMaterial] ?? "").trim() : "",
      qtdPrevista: iQtd >= 0 ? row[iQtd] : "",
      ume: iUme >= 0 ? String(row[iUme] ?? "").trim() : "",
      placa: String(row[iPlaca] ?? "").trim(),
      placaCarreta: iPlacaCarreta >= 0 ? String(row[iPlacaCarreta] ?? "").trim() : "",
      terceiraPlaca: iTerceiraPlaca >= 0 ? String(row[iTerceiraPlaca] ?? "").trim() : "",
      pesoBruto: iPesoBruto >= 0 ? row[iPesoBruto] : "",
      pesoTara: iPesoTara >= 0 ? row[iPesoTara] : "",
      dataCriacao: iData >= 0 ? formatCelulaData(row[iData]) : "",
      horaCriacao: iHora >= 0 ? formatCelulaHora(row[iHora]) : "",
    });
  }
  return cargas;
}
async function encontrarArquivoNaPasta(dirHandle) {
  let candidato = null;
  for await (const [name, entry] of dirHandle.entries()) {
    if (entry.kind === "file" && name.toUpperCase().includes(CONFIG.FILE_NAME_MATCH.toUpperCase())) candidato = entry;
  }
  if (!candidato) throw new Error(`Nenhum arquivo com "${CONFIG.FILE_NAME_MATCH}" no nome foi encontrado nessa pasta.`);
  return candidato;
}
async function lerCargasDaPasta(dirHandle) {
  const fileHandle = await encontrarArquivoNaPasta(dirHandle);
  const file = await fileHandle.getFile();
  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, { type: "array", cellDates: true });
  const sheetName = CONFIG.SHEET_NAME && wb.SheetNames.includes(CONFIG.SHEET_NAME) ? CONFIG.SHEET_NAME : wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true });
  return { cargas: parseLinhasPlanilha(rows), nomeArquivo: file.name };
}

  const [detalheId, setDetalheId] = useState(null);

  async function abrirDetalhe(registro) {
    setDetalheId(registro.id);
    setCarregandoDetalhe(true);
    try {
      const arquivos = await obterEvidencias(registro.id);
      setDetalheEvidencias(arquivos.map((a) => ({ ...a, url: URL.createObjectURL(a.blob) })));
    } catch (e) { setDetalheEvidencias([]); }
    finally { setCarregandoDetalhe(false); }
  }
  function fecharDetalhe() {
    detalheEvidencias.forEach((a) => URL.revokeObjectURL(a.url));
    setDetalheId(null);
    setDetalheEvidencias([]);
  }
  const registroDetalhe = inspecoes.find((r) => r.id === detalheId);

  const romaneiosInspecionados = useMemo(() => new Set(inspecoes.map((r) => r.romaneio)), [inspecoes]);
  const pendentesAtivas = useMemo(() => pendentes.filter((c) => !romaneiosInspecionados.has(c.romaneio)), [pendentes, romaneiosInspecionados]);

  const indicadores = useMemo(() => {
    const hoje = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
    const hojeLista = inspecoes.filter((r) => r.data === hoje);

    const realizadosManual = pendentesAtivas.filter((p) => p.statusInspecao === "Realizado");
    const realizadosManualHoje = realizadosManual.filter((p) => p.marcadoEm === hoje).length;

    const totalRealizadas = inspecoes.length + realizadosManual.length;
    const totalExpedidas = pendentesAtivas.length + inspecoes.length;
    const percentual = totalExpedidas > 0 ? Math.round((totalRealizadas / totalExpedidas) * 100) : 0;

    return {
      qtdHoje: hojeLista.length + realizadosManualHoje,

  const EXT_VIDEO = ["mp4", "mov", "avi", "mkv", "webm", "3gp", "m4v", "wmv"];
  const EXT_IMAGEM = ["jpg", "jpeg", "png", "gif", "webp", "heic", "heif", "bmp"];
  function tipoDoArquivo(f) {
    if (f.type.startsWith("video/")) return "video";
    if (f.type.startsWith("image/")) return "imagem";
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    if (EXT_VIDEO.includes(ext)) return "video";
    if (EXT_IMAGEM.includes(ext)) return "imagem";
    return null;
  }

  const videos = form.evidencias.filter((f) => tipoDoArquivo(f) === "video");
  const imagens = form.evidencias.filter((f) => tipoDoArquivo(f) === "imagem");
  const totalBytes = form.evidencias.reduce((s, f) => s + f.size, 0);

  const sincronizarPasta = useCallback(async (handle) => {
    const h = handle || pastaHandle;
    if (!h) return;
    setLendo(true);
    setErroPasta("");
    try {
      const perm = await h.queryPermission({ mode: "read" });
      if (perm !== "granted") {
        const novo = await h.requestPermission({ mode: "read" });
        if (novo !== "granted") throw new Error("Permissão de leitura da pasta foi negada.");
      }
      const { cargas, nomeArquivo } = await lerCargasDaPasta(h);
      setPendentes((atual) => cargas.map((c) => {
        const existente = atual.find((p) => p.romaneio === c.romaneio);
        return { ...c, statusInspecao: existente ? existente.statusInspecao : "Pendente" };
      }));
      setArquivoAtual(nomeArquivo);
      setUltimaAtualizacao(new Date());
    } catch (e) { setErroPasta(e.message || "Falha ao ler o arquivo da pasta."); }
    finally { setLendo(false); }
  }, [pastaHandle]);

  useEffect(() => {
    if (!pastaHandle) return;
    sincronizarPasta(pastaHandle);
    const t = setInterval(() => sincronizarPasta(pastaHandle), CONFIG.REFRESH_MS);
    return () => clearInterval(t);
  }, [pastaHandle]); // eslint-disable-line

  async function selecionarPasta() {
    setErroPasta("");
    if (!SUPORTA_PASTA) { setErroPasta("Disponível apenas no Chrome ou Edge."); setPastaFalhou(true); return; }
    try {
      const handle = await window.showDirectoryPicker();
      setPastaHandle(handle);
      setPastaNome(handle.name);
    } catch (e) {
      if (e.name !== "AbortError") {
        setErroPasta("Não foi possível abrir a pasta neste navegador. Use \"Selecionar planilha manualmente\" abaixo.");
        setPastaFalhou(true);
      }
    }
  }

  const planilhaInputRef = useRef(null);
  async function selecionarArquivoManual(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setLendo(true);
    setErroPasta("");
    try {
      const buffer = await file.arrayBuffer();
      const wb = XLSX.read(buffer, { type: "array", cellDates: true });
      const sheetName = CONFIG.SHEET_NAME && wb.SheetNames.includes(CONFIG.SHEET_NAME) ? CONFIG.SHEET_NAME : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true });
      const cargas = parseLinhasPlanilha(rows);
      setPendentes((atual) => cargas.map((c) => {
        const existente = atual.find((p) => p.romaneio === c.romaneio);
        return { ...c, statusInspecao: existente ? existente.statusInspecao : "Pendente" };
      }));
      setArquivoAtual(file.name);
      setUltimaAtualizacao(new Date());
      setPastaNome("");
      setPastaHandle(null);
    } catch (err) { setErroPasta(err.message || "Falha ao ler o arquivo selecionado."); }
    finally { setLendo(false); }
  }

  function handleFiles(fileList) {
    const novos = Array.from(fileList);
    let vNovos = videos.length, iNovos = imagens.length;
    const aceitos = [], rejLimite = [], rejTipo = [];
    for (const f of novos) {
      const tipo = tipoDoArquivo(f);
      if (tipo === "video") { if (vNovos < MAX_VIDEOS) { vNovos++; aceitos.push(f); } else rejLimite.push(f.name); }
      else if (tipo === "imagem") { if (iNovos < MAX_IMAGES) { iNovos++; aceitos.push(f); } else rejLimite.push(f.name); }
      else rejTipo.push(f.name);
    }
    const partes = [];
    if (rejLimite.length) partes.push(`Limite atingido: no máximo ${MAX_VIDEOS} vídeos ou ${MAX_IMAGES} imagens. ${rejLimite.length} arquivo(s) não anexado(s).`);
    if (rejTipo.length) partes.push(`Formato não reconhecido e não anexado: ${rejTipo.join(", ")}.`);
    setErro(partes.join(" "));
    setForm((f) => ({ ...f, evidencias: [...f.evidencias, ...aceitos] }));
  }
  function removerEvidencia(idx) { setForm((f) => ({ ...f, evidencias: f.evidencias.filter((_, i) => i !== idx) })); }

  const cargaSelecionada = useMemo(() => pendentes.find((c) => c.romaneio === form.romaneio), [pendentes, form.romaneio]);
  const pendentesCDE = useMemo(() => pendentesAtivas.filter((c) => (c.statusInspecao || "Pendente") !== "Realizado"), [pendentesAtivas]);

  function resetForm() {
    setForm({ evidencias: [], inspetor: "", romaneio: "", carreta1: "", carreta2: "", carreta3: "", situacao: "", data: dataDeHoje(), filial: FILIAIS[0] });
    setErro("");
  }

  function submeter(e) {
    e.preventDefault();
    const falhar = (msg) => {
      setErro(msg);
      setToast(msg);
      setTimeout(() => setToast(null), 5000);
      const formEl = e.target;
      if (formEl && formEl.scrollIntoView) formEl.scrollIntoView({ behavior: "smooth", block: "start" });
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    try {
      if (!form.romaneio) return falhar("Selecione o romaneio/placa referente à carga pendente.");
      if (!form.inspetor.trim()) return falhar("Informe o inspetor responsável.");
      if (!form.situacao) return falhar("Selecione a situação: Com Vazamento ou Sem Vazamento.");
      if (!form.data) return falhar("Selecione a data da inspeção.");
      if (form.evidencias.length === 0) return falhar("Anexe ao menos 1 evidência (vídeo ou imagem) — role até o topo do formulário.");

      const registro = {
        id: `INSP-${Date.now()}`,
        romaneio: form.romaneio, inspetor: form.inspetor, carreta1: form.carreta1, carreta2: form.carreta2, carreta3: form.carreta3,
        situacao: form.situacao, data: form.data, filial: form.filial,
        nomesEvidencias: form.evidencias.map((f) => f.name),
        placa: cargaSelecionada ? cargaSelecionada.placa : "",
        qtdVideos: videos.length, qtdImagens: imagens.length, tamanhoTotal: totalBytes,
        criadoEm: new Date().toISOString(),
      };
      setInspecoes((list) => [registro, ...list]);
      setPendentes((list) => list.filter((c) => c.romaneio !== form.romaneio));
      salvarEvidencias(registro.id, form.evidencias).catch((err) => {
        console.error(err);
        setToast(`Inspeção registrada, mas houve falha ao salvar os arquivos de evidência localmente: ${err.message || err}`);
        setTimeout(() => setToast(null), 7000);
      });

      if (form.situacao === "Com Vazamento") {
        setToast(`Inspeção registrada com vazamento. Use o botão de e-mail no Histórico para enviar o alerta para ${CONFIG.EMAIL_ALERTA}.`);
      } else {
        setToast(`Inspeção do romaneio ${form.romaneio} (placa ${registro.placa}) registrada.`);
      }
      setErro("");
      resetForm();
      setTab("historico");
      setTimeout(() => setToast(null), 5500);
    } catch (err) {
      console.error("Falha ao registrar inspeção:", err);
      falhar(`Erro inesperado ao registrar: ${err.message || err}. Se persistir, tire um print desta mensagem.`);
    }
  }

  function simularPuxadaSap() {
    const placasDemo = ["QCT9K21", "RSD3B44", "QLM8P02", "RVN5H91"];
    const placa = placasDemo[Math.floor(Math.random() * placasDemo.length)];
    const placaCarreta = placasDemo[Math.floor(Math.random() * placasDemo.length)];
    setPendentes((list) => [...list, {
      romaneio: String(2000928000 + Math.floor(Math.random() * 9999)),
      filial: "1002-SMT", status: "Finalizado", material: "DDG FS UMIDO",
      qtdPrevista: (35 + Math.random() * 6).toFixed(3), ume: "KG", placa, placaCarreta, terceiraPlaca: "",
      pesoBruto: 0, pesoTara: 0, statusInspecao: "Pendente",
      dataCriacao: new Date().toLocaleDateString("pt-BR"),
      horaCriacao: new Date().toLocaleTimeString("pt-BR"),
    }]);
  }

  function mudarStatusInspecao(romaneio, novoStatus) {
    const hoje = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
    setPendentes((list) => list.map((c) => c.romaneio === romaneio
      ? { ...c, statusInspecao: novoStatus, marcadoEm: novoStatus === "Realizado" ? hoje : null }
      : c
    ));
  }

            </button>

            <form onSubmit={submeter}>

                <div className="ev-actions">

              <div style={{ padding: "22px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "var(--text-dim)" }}>
                  <span><b style={{ color: "var(--text)" }}>{indicadores.totalRealizadas}</b> realizadas</span>
                  <span><b style={{ color: "var(--text)" }}>{indicadores.totalExpedidas}</b> expedidas (total considerado)</span>
                </div>
                <div className="progress-track"><div className="progress-fill" style={{ width: `${indicadores.percentual}%` }}></div></div>
                <div className="sub" style={{ marginTop: 14, lineHeight: 1.6 }}>
                  Cálculo: (inspeções registradas com evidência + cargas marcadas como "Realizado" no Monitoramento) ÷
                  (essas somadas + cargas ainda pendentes), com base no que este app tem carregado no momento —
                  não é uma consulta direta ao volume total expedido pela filial no SAP.
                </div>
              </div>
            </div>
          </React.Fragment>
        )}
      </div>
      {toast && <div className="toast"><CheckIcon size={15} />{toast}</div>}

      {detalheId && (
        <div className="modal-backdrop" onClick={fecharDetalhe}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <h3>Evidências — Romaneio {registroDetalhe && registroDetalhe.romaneio}</h3>
                <div className="sub">{registroDetalhe && `Placa ${registroDetalhe.placa} · ${registroDetalhe.inspetor} · ${registroDetalhe.data.split("-").reverse().join("/")}`}</div>
              </div>
              <button className="btn-ghost" onClick={fecharDetalhe}><XIcon size={14} /> Fechar</button>
            </div>
            <div className="modal-body">
              {carregandoDetalhe ? (
                <div className="empty">Carregando evidências…</div>
              ) : detalheEvidencias.length === 0 ? (
                <div className="empty">Nenhuma evidência encontrada para este registro.</div>
              ) : (
                <div className="ev-grid">
                  {detalheEvidencias.map((a, i) => (
                    <div className="ev-card" key={i}>
                      {tipoDoArquivo(a) === "video" ? <video src={a.url} controls /> : <img src={a.url} alt={a.name} />}
                      <div className="ev-card-foot">
                        <span className="nm" title={a.name}>{a.name}</span>
                        <a className="btn-ghost" href={a.url} download={a.name}><DownloadIcon size={13} /> Baixar</a>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

window.addEventListener("error", (ev) => {
  const el = document.getElementById("root");
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;bottom:20px;left:12px;right:12px;background:#3a1c1e;border:1px solid #e5484d;color:#ff9a9e;padding:12px 16px;border-radius:10px;font-size:12.5px;font-family:monospace;z-index:9999;max-height:40vh;overflow:auto;";
  box.textContent = "Erro JS: " + (ev.message || ev.error);
  document.body.appendChild(box);
});
window.addEventListener("unhandledrejection", (ev) => {
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;bottom:20px;left:12px;right:12px;background:#3a1c1e;border:1px solid #e5484d;color:#ff9a9e;padding:12px 16px;border-radius:10px;font-size:12.5px;font-family:monospace;z-index:9999;max-height:40vh;overflow:auto;";
  box.textContent = "Promise rejeitada: " + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason);
  document.body.appendChild(box);
});
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
